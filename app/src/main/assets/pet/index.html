<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>AccompanyPet</title>
<style>
  /* 常數定義：角色 96×108、泡泡寬 160、泡泡最高 240（與 OverlayService 的 BUBBLE_MAX_HEIGHT_DP 相同；單位為 CSS px＝dp） */
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; height: 100%; }
  body { display: flex; flex-direction: row; justify-content: flex-end; align-items: flex-end;
         font-family: sans-serif; user-select: none; -webkit-user-select: none; }
  html[data-side="left"] body { flex-direction: row-reverse; } /* 角色在左邊時泡泡放右側 */
  html[data-grow="down"] body { align-items: flex-start; } /* 角色太靠近螢幕頂端時，泡泡往下長 */
  #bubble { display: none; box-sizing: border-box; width: 156px; max-height: 240px; margin: 0 4px;
            padding: 6px 8px; background: rgba(255,255,255,0.95); border-radius: 12px; color: #222;
            font-size: 13px; line-height: 1.35; overflow: hidden; }
  #bubble.show { display: flex; flex-direction: column; gap: 6px; }
  /* 只有台詞區捲動；戒飲按鈕與「說話」「聊聊」「沒喝」固定在泡泡底部 */
  #text { white-space: pre-wrap; word-break: break-all; min-height: 1em; flex: 1 1 auto; overflow-y: auto; }
  #actions { display: flex; flex-direction: row; flex-wrap: wrap; gap: 6px; flex: 0 0 auto; } /* 「說話」「聊聊」「沒喝」依序排，放不下就換行 */
  #mic, #chat, #resist { border: none; border-radius: 16px; padding: 4px 10px; color: #fff; font-size: 13px; }
  #mic { background: #ff8fab; }
  #chat { background: #8fb8ff; }
  #resist { background: #8fd3a8; }
  #drinkActions { display: none; flex-direction: row; flex-wrap: wrap; gap: 4px; } /* 戒飲記錄的按鈕（複述、選項、撤銷） */
  #drinkActions.show { display: flex; flex: 0 0 auto; }
  #drinkActions button { border: 1px solid #ffb3c6; border-radius: 12px; padding: 3px 8px; background: #fff;
                         color: #222; font-size: 12px; }
  #pet { width: 96px; height: 108px; flex: 0 0 auto; position: relative; }
  #pet img { width: 100%; height: 100%; object-fit: contain; position: absolute; left: 0; top: 0;
             transform-origin: 50% 100%; }
  #pet { transform-origin: 50% 100%; } /* 呼吸改由 JS 以低幀率驅動，省電 */
  #blink { visibility: hidden; }
</style>
</head>
<body>
  <div id="bubble"><div id="text"></div><div id="drinkActions"></div><div id="actions"><button id="mic" type="button">🎤 說話</button><button id="chat" type="button">💬 聊聊</button><button id="resist" type="button">沒喝</button></div></div>
  <div id="pet"><img id="idle" alt=""><img id="blink" alt=""></div>
<script src="emotion-map.js"></script>
<script src="vendor/stream-parser.js"></script>
<script src="performance.js"></script>
<script src="drink-labels.js"></script>
<script src="drink-view.js"></script>
<script>
  // 常數定義
  var BLINK_MS = 150;        // 眨眼圖顯示時間
  var BLINK_MIN_MS = 4000;   // 眨眼最短間隔
  var BLINK_MAX_MS = 6000;   // 眨眼最長間隔
  var BREATH_PERIOD_MS = 3000; // 呼吸週期
  var BREATH_FPS = 10;         // 呼吸每秒更新次數（CSS 動畫會以 60fps 持續重繪，耗電又容易被系統判定為高耗電）
  var EMOTION_MAP = window.PetEmotionMap;   // 表情對照表（emotion-map.js，契約檔）
  var PERF = window.PetPerformance;         // 演出排程（performance.js，純函式）
  var IDLE_PLACEHOLDER = 'frames/placeholder-idle.svg'; // 平常的臉也載不到時的替代圖
  var DRINK_LABELS = window.PetDrinkLabels;  // 戒飲記錄的文字（drink-labels.js，契約檔）
  var DRINK_VIEW = window.PetDrinkView;      // 戒飲記錄的台詞與按鈕（drink-view.js，純函式）
  var THINKING_EMOTION = 'thinking';         // 等待 Worker 回應時的臉
  var THINKING_TEXT = '…';                   // 等待 Worker 回應時泡泡裡的字
  var RESIST_ACTION = { action: 'resist' };  // 泡泡上「沒喝」交給原生的動作

  var drinkDraft = null;       // 目前這組戒飲按鈕對應的草稿（改甜度時用）
  var drinkGroup = 0;          // 戒飲按鈕組的序號：撤銷計時只收掉自己那一組
  var undoTimer = null;        // 撤銷按鈕自動移除的計時器

  var breathTimer = null;      // 呼吸計時器
  var blinkTimer = null;     // 下一次眨眼的計時器
  var unblinkTimer = null;   // 眨眼結束的計時器
  var playing = false;       // 目前是否播放中

  var stage = PERF.createStage(); // 演出舞台：目前這一則與排在後面的
  var perfTimers = [];            // 這一則演出排下的所有計時器
  var shownFrame = EMOTION_MAP.idleFrame; // 畫面上正在顯示的表情圖檔名
  var faceRequest = 0;            // 換臉請求序號：只套用最新一次的載入結果

  // 先載入 local 圖，失敗就改用 placeholder SVG（不顯示錯誤）
  function loadFrame(img, name) {
    img.onerror = function () { img.onerror = null; img.src = 'frames/placeholder-' + name + '.svg'; };
    img.src = 'frames/local/' + name + '.png';
  }

  // 畫面上是否為待機圖（只有這時候才眨眼）
  function isIdleShown() {
    return shownFrame === EMOTION_MAP.idleFrame;
  }

  // 排定下一次眨眼（不是待機圖或沒在播放就不排）
  function scheduleBlink() {
    if (!playing || !isIdleShown() || blinkTimer !== null) return;
    var wait = BLINK_MIN_MS + Math.random() * (BLINK_MAX_MS - BLINK_MIN_MS);
    blinkTimer = setTimeout(doBlink, wait);
  }

  // 切到眨眼圖 150 毫秒再切回來
  function doBlink() {
    blinkTimer = null;
    if (!isIdleShown()) return; // 換成其他表情時不眨眼
    document.getElementById('blink').style.visibility = 'visible';
    unblinkTimer = setTimeout(function () {
      unblinkTimer = null;
      document.getElementById('blink').style.visibility = 'hidden';
      scheduleBlink();
    }, BLINK_MS);
  }

  // 取消眨眼並收起眨眼圖
  function cancelBlink() {
    clearTimeout(blinkTimer); clearTimeout(unblinkTimer);
    blinkTimer = null; unblinkTimer = null;
    document.getElementById('blink').style.visibility = 'hidden';
  }

  // 依時間算出這一格的呼吸位移
  function breathStep() {
    var t = (Date.now() % BREATH_PERIOD_MS) / BREATH_PERIOD_MS;
    var k = (1 - Math.cos(t * 2 * Math.PI)) / 2;  // 0→1→0 的平滑曲線
    document.getElementById("pet").style.transform = "translateY(" + (-2 * k).toFixed(2) + "px) scaleY(" + (1 + 0.02 * k).toFixed(4) + ")";
  }

  // 停掉眨眼與呼吸的計時器
  function clearTimers() {
    cancelBlink();
    clearInterval(breathTimer);
    breathTimer = null;
  }

  // 新的臉真正顯示出來之後：記下檔名，依是否為待機圖決定眨不眨眼
  function onFaceShown(file) {
    shownFrame = file;
    if (isIdleShown()) scheduleBlink(); else cancelBlink();
  }

  // 換整張表情圖：先在背景載入，成功才換上；失敗就保留上一張臉（不出現空白）
  function setFace(emotion) {
    var file = PERF.frameFor(emotion, EMOTION_MAP);
    faceRequest += 1;
    var request = faceRequest;
    if (!file || file === shownFrame) return; // 同一張不必重載
    var probe = new Image();
    probe.onload = function () {
      if (request !== faceRequest) return; // 已經有更新的換臉請求
      document.getElementById('idle').src = probe.src;
      onFaceShown(file);
    };
    probe.onerror = function () {
      if (request !== faceRequest) return;
      if (file !== EMOTION_MAP.idleFrame) return; // 保留上一張臉
      document.getElementById('idle').src = IDLE_PLACEHOLDER; // 連平常的臉都載不到：退回 placeholder
      onFaceShown(file);
    };
    probe.src = EMOTION_MAP.frameRoot + file;
  }

  // 台詞區捲到最底下（逐字時讓最新一行露出來；按鈕固定在泡泡底部，不跟著捲）
  function scrollBubbleToBottom() {
    var text = document.getElementById('text');
    text.scrollTop = text.scrollHeight;
  }

  // 清掉這一則演出排下的所有計時器
  function clearPerformance() {
    for (var i = 0; i < perfTimers.length; i += 1) clearTimeout(perfTimers[i]);
    perfTimers = [];
  }

  // 執行演出的一個步驟：face 換臉，count 以 textContent 顯示前 count 個字
  function applyStep(step, text) {
    if (step.face !== undefined) { setFace(step.face); return; }
    document.getElementById('text').textContent = text.slice(0, step.count); // 用 textContent，不解析 HTML
    scrollBubbleToBottom();
  }

  // 依 planTimeline 排計時器開演目前這一則；演完接著演下一則
  function startCurrent() {
    clearPerformance();
    if (stage.current === null) return;
    var plan = PERF.planTimeline(stage.current, EMOTION_MAP.frames, EMOTION_MAP.defaultEmotion);
    document.getElementById('text').textContent = '';
    plan.steps.forEach(function (step) {
      if (step.atMs === 0) { applyStep(step, plan.text); return; } // 開頭的臉立刻換，不等下一輪
      perfTimers.push(setTimeout(function () { applyStep(step, plan.text); }, step.atMs));
    });
    perfTimers.push(setTimeout(finishCurrent, plan.endMs)); // 與結尾換臉同一時間，排在它之後
  }

  // 一則演完：換下一則上場
  function finishCurrent() {
    perfTimers = [];
    stage = PERF.stageFinish(stage);
    startCurrent();
  }

  // 跳到演完：清掉演出計時器，泡泡一次顯示全部完整台詞，臉換回平常的臉；沒在演就什麼都不做
  function skipToEnd() {
    if (stage.current === null) return;
    clearPerformance();
    var result = PERF.stageSkip(stage, EMOTION_MAP.frames, EMOTION_MAP.defaultEmotion);
    stage = result.stage;
    document.getElementById('text').textContent = result.text; // 用 textContent，不解析 HTML
    document.getElementById('text').scrollTop = 0; // 完整台詞從頭讀起
    setFace(result.face);
  }

  // 呼叫原生橋接（在瀏覽器測試時沒有 PetBridge 就略過）
  function callBridge(name) {
    if (window.PetBridge && window.PetBridge[name]) window.PetBridge[name]();
  }

  // 把戒飲動作交給原生（PetBridge.onDrinkAction，參數是 JSON 字串；沒有這個方法就略過）
  function sendDrinkAction(action) {
    if (window.PetBridge && window.PetBridge.onDrinkAction) window.PetBridge.onDrinkAction(JSON.stringify(action));
  }

  // 收掉目前這組戒飲按鈕與撤銷計時
  function clearDrinkButtons() {
    clearTimeout(undoTimer);
    undoTimer = null;
    drinkGroup += 1;
    var box = document.getElementById('drinkActions');
    while (box.firstChild) box.removeChild(box.firstChild);
    box.classList.remove('show');
  }

  // 按下一顆戒飲按鈕：先收掉這組；改甜度換成 5 顆糖度，其餘交給原生
  function onDrinkButton(action) {
    clearDrinkButtons();
    if (action.local === 'sugarMenu') { showDrinkButtons(DRINK_VIEW.sugarMenu(drinkDraft, DRINK_LABELS)); return; }
    sendDrinkAction(action);
  }

  // 放上一組新的戒飲按鈕（取代舊的一組）；含撤銷時排定自動移除
  function showDrinkButtons(buttons) {
    clearDrinkButtons();
    var box = document.getElementById('drinkActions');
    var hasUndo = false;
    buttons.forEach(function (item) {
      var el = document.createElement('button');
      el.type = 'button';
      el.textContent = item.label; // 用 textContent，不解析 HTML
      el.addEventListener('click', function () { onDrinkButton(item.action); });
      box.appendChild(el);
      if (item.action.action === 'undo') hasUndo = true;
    });
    box.classList.toggle('show', buttons.length > 0);
    if (hasUndo) {
      var group = drinkGroup;
      undoTimer = setTimeout(function () { if (group === drinkGroup) clearDrinkButtons(); }, DRINK_LABELS.undoMs);
    }
    scrollBubbleToBottom();
  }

  // 原生 → 網頁的介面
  window.pet = {
    // 切換播放或暫停；暫停（例如螢幕關閉）時演出直接跳到演完
    setRender: function (mode) {
      if (mode === 'paused') skipToEnd();
      clearTimers();
      playing = (mode === 'playing');
      if (playing) { scheduleBlink(); breathTimer = setInterval(breathStep, 1000 / BREATH_FPS); }
    },
    // 演出一則帶表情標籤的台詞：沒在演就立刻開演，否則排在後面接著演
    say: function (script) {
      if (typeof script !== 'string' || script.length === 0) return; // 空字串忽略，不排隊
      var wasIdle = stage.current === null;
      stage = PERF.stageSay(stage, script);
      if (wasIdle) startCurrent();
    },
    // 在泡泡裡顯示文字（系統訊息）：先跳到演完，再換成這段文字，臉為平常的臉
    showText: function (text) {
      skipToEnd();
      document.getElementById('text').textContent = String(text); // 用 textContent，不解析 HTML
      setFace(EMOTION_MAP.defaultEmotion);
    },
    // 顯示或收起泡泡；收起時演出直接跳到演完
    showBubble: function (show) {
      if (!show) skipToEnd();
      document.getElementById('bubble').classList.toggle('show', !!show);
    },
    // 等待 Worker 回應：true 時換思考的臉、泡泡顯示「…」；false 時換回平常的臉
    thinking: function (on) {
      if (on) {
        skipToEnd();
        document.getElementById('text').textContent = THINKING_TEXT;
        setFace(THINKING_EMOTION);
        return;
      }
      setFace(EMOTION_MAP.defaultEmotion);
    },
    // 顯示戒飲記錄的回應（Worker 回應原文或 App 組的 ask）：台詞交給 say 演出，按鈕取代舊的一組；解析失敗就忽略
    showDrink: function (jsonText) {
      var resp;
      try { resp = JSON.parse(jsonText); } catch (e) { return; }
      if (!resp || typeof resp !== 'object') return;
      var view = DRINK_VIEW.viewFor(resp, DRINK_LABELS);
      drinkDraft = resp.draft || null;
      showDrinkButtons(view.buttons);
      window.pet.say(view.script);
    }
  };

  loadFrame(document.getElementById('idle'), 'idle');
  loadFrame(document.getElementById('blink'), 'blink');
  document.getElementById('pet').addEventListener('click', function () { callBridge('onPetTapped'); });
  document.getElementById('mic').addEventListener('click', function () { callBridge('onMicPressed'); });
  document.getElementById('chat').addEventListener('click', function () { callBridge('onChatPressed'); });
  document.getElementById('resist').addEventListener('click', function () { sendDrinkAction(RESIST_ACTION); });
  window.pet.setRender('playing');
</script>
</body>
</html>
