<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="100%" height="100%" style="background-color: #0b0f19; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans TC', Roboto, sans-serif;">
  <defs>
    <!-- 卡片與背景陰影 -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <filter id="orangeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#f97316" flood-opacity="0.6"/>
    </filter>
    <filter id="greenGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#10b981" flood-opacity="0.4"/>
    </filter>

    <!-- 箭頭端點 -->
    <marker id="arrow-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10b981"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f97316"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <!-- ==================== 頂部標題與圖例 ==================== -->
  <rect x="0" y="0" width="1200" height="90" fill="#111827"/>
  <line x1="0" y1="90" x2="1200" y2="90" stroke="#1f2937" stroke-width="1.5"/>

  <text x="40" y="42" fill="#f9fafb" font-size="22" font-weight="800" letter-spacing="0.5">AccompanyPet M3（Todoist 雙軌提醒）端到端打通直觀藍圖</text>
  <text x="40" y="68" fill="#9ca3af" font-size="13">台詞演出與推播通道早已驗收打通（綠線暢通）｜ 清楚標示出手機完整見效「真正缺少的 4 個接線點」</text>

  <!-- 圖例 -->
  <g transform="translate(740, 24)">
    <rect x="0" y="0" width="420" height="48" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <!-- 既有暢通 -->
    <rect x="18" y="15" width="16" height="16" rx="4" fill="#065f46" stroke="#10b981" stroke-width="1.5"/>
    <text x="42" y="27" fill="#d1fae5" font-size="12" font-weight="600">既有基建已通（M1.6實測通過）</text>
    <!-- 待打通 -->
    <rect x="235" y="15" width="16" height="16" rx="4" fill="#7c2d12" stroke="#f97316" stroke-width="1.5"/>
    <text x="259" y="27" fill="#ffedd5" font-size="12" font-weight="700">真正待打通關鍵斷點（共4處）</text>
  </g>

  <!-- ==================== 三大泳道背景 ==================== -->

  <!-- 泳道 1: 雲端與後端 -->
  <rect x="35" y="110" width="365" height="680" rx="12" fill="#111c30" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="35" y="110" width="365" height="42" rx="12" fill="#1e293b"/>
  <text x="55" y="137" fill="#38bdf8" font-size="15" font-weight="700">☁️ 雲端服務與後端 (Cloud / Worker)</text>

  <!-- 泳道 2: Android 原生殼 -->
  <rect x="420" y="110" width="360" height="680" rx="12" fill="#131b2e" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="420" y="110" width="360" height="42" rx="12" fill="#1e293b"/>
  <text x="440" y="137" fill="#c084fc" font-size="15" font-weight="700">📱 手機原生層 (Kotlin / Android)</text>

  <!-- 泳道 3: 手機懸浮窗畫面 -->
  <rect x="800" y="110" width="365" height="680" rx="12" fill="#18172b" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="800" y="110" width="365" height="42" rx="12" fill="#1e293b"/>
  <text x="820" y="137" fill="#f472b6" font-size="15" font-weight="700">🐾 手機懸浮窗演出 (Overlay WebView)</text>

  <!-- ==================== 模組卡片繪製 ==================== -->

  <!-- [卡片 1A] Todoist 官方伺服器 -->
  <g transform="translate(55, 175)">
    <rect x="0" y="0" width="325" height="80" rx="10" fill="#1e293b" stroke="#e11d48" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="18" y="28" fill="#fda4af" font-size="14" font-weight="700">Todoist REST API (官方)</text>
    <text x="18" y="50" fill="#94a3b8" font-size="11">提供使用者任務清單 / 接收建立與修改指令</text>
    <text x="18" y="68" fill="#cbd5e1" font-size="11">需 Token：TODOIST_TOKEN (已存 wrangler.toml)</text>
  </g>

  <!-- [卡片 1B] 斷點一：Worker 掃描與篩選 -->
  <g transform="translate(55, 300)">
    <rect x="0" y="0" width="325" height="155" rx="10" fill="#1a1c2e" stroke="#f97316" stroke-width="2.5" stroke-dasharray="6 3" filter="url(#orangeGlow)"/>
    <rect x="18" y="14" width="76" height="20" rx="4" fill="#c2410c"/>
    <text x="24" y="28" fill="#ffffff" font-size="10" font-weight="800">關鍵斷點 ①</text>
    <text x="104" y="29" fill="#fed7aa" font-size="14" font-weight="700">任務抓取排程與篩選</text>
    
    <text x="18" y="56" fill="#fca5a5" font-size="12" font-weight="600">❌ 缺：Cron 定時觸發 (09:00 / 08:30 / 21:00)</text>
    <text x="18" y="76" fill="#fca5a5" font-size="12" font-weight="600">❌ 缺：呼叫 GET /rest/v2/tasks 抓候選清單</text>
    <line x1="18" y1="90" x2="305" y2="90" stroke="#334155" stroke-width="1"/>
    <text x="18" y="110" fill="#34d399" font-size="12" font-weight="700">🟢 已具備核心邏輯 (todoist.js)：</text>
    <text x="18" y="128" fill="#94a3b8" font-size="11">• isP2Stale (篩選擱置14天最久那件)</text>
    <text x="18" y="144" fill="#94a3b8" font-size="11">• 套用 todoist-lines.json (預設台詞已定義)</text>
  </g>

  <!-- [卡片 1C] 斷點四：Worker 寫入端點 -->
  <g transform="translate(55, 590)">
    <rect x="0" y="0" width="325" height="165" rx="10" fill="#1a1c2e" stroke="#f97316" stroke-width="2.5" stroke-dasharray="6 3" filter="url(#orangeGlow)"/>
    <rect x="18" y="14" width="76" height="20" rx="4" fill="#c2410c"/>
    <text x="24" y="28" fill="#ffffff" font-size="10" font-weight="800">關鍵斷點 ④</text>
    <text x="104" y="29" fill="#fed7aa" font-size="14" font-weight="700">寫入動作與子任務建立</text>

    <text x="18" y="56" fill="#34d399" font-size="12" font-weight="700">🟢 POST /api/todoist/action 路由已就緒</text>
    <text x="18" y="74" fill="#94a3b8" font-size="11">目前收到按鈕動作後僅記錄至 KV 日誌</text>
    <line x1="18" y1="88" x2="305" y2="88" stroke="#334155" stroke-width="1"/>
    <text x="18" y="108" fill="#fca5a5" font-size="12" font-weight="600">❌ 缺：呼叫 Todoist API 更新到期日 (推進/延期)</text>
    <text x="18" y="128" fill="#fca5a5" font-size="12" font-weight="600">❌ 缺：若選拆成小步驟，由 LLM 生成 2~3 步</text>
    <text x="18" y="148" fill="#fca5a5" font-size="12" font-weight="600">❌ 缺：確認後 POST 帶 parent_id 建立子任務</text>
  </g>

  <!-- [卡片 2A] 原生推播接收與分流 (已通) -->
  <g transform="translate(440, 250)">
    <rect x="0" y="0" width="320" height="150" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="1.8" filter="url(#greenGlow)"/>
    <rect x="18" y="14" width="60" height="20" rx="4" fill="#059669"/>
    <text x="24" y="28" fill="#ffffff" font-size="10" font-weight="800">已就緒 🟢</text>
    <text x="88" y="29" fill="#a7f3d0" font-size="14" font-weight="700">FCM 接收與分流中心</text>

    <text x="18" y="56" fill="#e2e8f0" font-size="12">• PetMessagingService 接收高優先推播</text>
    <text x="18" y="76" fill="#e2e8f0" font-size="12">• ReminderDispatcher 判斷去重與遊戲排隊</text>
    <text x="18" y="96" fill="#e2e8f0" font-size="12">• OverlayService 啟動懸浮窗並傳入台詞</text>
    <text x="18" y="116" fill="#6ee7b7" font-size="11">✓ M1.5 / M1.6 實機驗收通過，推播通道暢通</text>
    <text x="18" y="134" fill="#94a3b8" font-size="11">（可原封不動直接傳送帶表情的 Todoist 台詞）</text>
  </g>

  <!-- [卡片 2B] 原生動作處理器 (部分就緒 / 缺橋接) -->
  <g transform="translate(440, 590)">
    <rect x="0" y="0" width="320" height="165" rx="10" fill="#1e293b" stroke="#a855f7" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect x="18" y="14" width="60" height="20" rx="4" fill="#059669"/>
    <text x="24" y="28" fill="#ffffff" font-size="10" font-weight="800">已就緒 🟢</text>
    <text x="88" y="29" fill="#e9d5ff" font-size="14" font-weight="700">TodoistActionHandler.kt</text>

    <text x="18" y="56" fill="#e2e8f0" font-size="12">• 支援 snooze、do_today、split、ask_date</text>
    <text x="18" y="76" fill="#e2e8f0" font-size="12">• 封裝 JSON 並由 WorkerApi.post 發送</text>
    <line x1="18" y1="90" x2="300" y2="90" stroke="#334155" stroke-width="1"/>
    <rect x="18" y="102" width="76" height="20" rx="4" fill="#c2410c"/>
    <text x="24" y="116" fill="#ffffff" font-size="10" font-weight="800">關鍵斷點 ③</text>
    <text x="104" y="117" fill="#fed7aa" font-size="13" font-weight="700">缺少 WebView 橋接</text>
    <text x="18" y="144" fill="#fca5a5" font-size="12" font-weight="600">❌ PetBridge 未暴露 onTodoistAction 介面</text>
  </g>

  <!-- [卡片 3A] 懸浮泡泡演出舞台 (台詞已通 / 缺選單掛載) -->
  <g transform="translate(820, 250)">
    <rect x="0" y="0" width="325" height="225" rx="10" fill="#1a1c2e" stroke="#ec4899" stroke-width="1.8" filter="url(#cardShadow)"/>
    <text x="18" y="29" fill="#f472b6" font-size="14" font-weight="700">桌寵台詞演出與選項泡泡</text>

    <!-- 台詞演出 (綠色暢通) -->
    <rect x="18" y="44" width="289" height="66" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="28" y="65" fill="#34d399" font-size="12" font-weight="700">🟢 台詞演繹管線 100% 暢通 (M1.6實測通過)</text>
    <text x="28" y="83" fill="#a7f3d0" font-size="11">• window.pet.say(script) 逐字打字與呼吸演出</text>
    <text x="28" y="99" fill="#a7f3d0" font-size="11">• [thinking] [pout] 自動切換整張表情差分圖</text>

    <!-- 斷點二：選項掛載 (橘色斷點) -->
    <rect x="18" y="122" width="289" height="88" rx="6" fill="#2d1515" stroke="#f97316" stroke-width="2" stroke-dasharray="5 2" filter="url(#orangeGlow)"/>
    <rect x="26" y="132" width="76" height="18" rx="3" fill="#c2410c"/>
    <text x="31" y="145" fill="#ffffff" font-size="10" font-weight="800">關鍵斷點 ②</text>
    <text x="110" y="146" fill="#fed7aa" font-size="12" font-weight="700">選項按鈕未掛載到泡泡</text>
    <text x="28" y="172" fill="#fca5a5" font-size="11" font-weight="600">❌ 缺：呼叫 todoist-view.js 的 viewForP2</text>
    <text x="28" y="192" fill="#fca5a5" font-size="11" font-weight="600">❌ 缺：泡泡底下顯示「推進/延後/拆步驟」按鈕</text>
  </g>

  <!-- [卡片 3B] 使用者點擊按鈕 (待發出事件) -->
  <g transform="translate(820, 590)">
    <rect x="0" y="0" width="325" height="165" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="18" y="29" fill="#38bdf8" font-size="14" font-weight="700">使用者點擊按鈕操作</text>
    <text x="18" y="52" fill="#94a3b8" font-size="12">按鈕定義已存在 todoist-view.js：</text>

    <rect x="18" y="65" width="289" height="30" rx="5" fill="#0f172a" stroke="#334155"/>
    <text x="28" y="85" fill="#f8fafc" font-size="11">👉 [今天推進一小步] [延後一週] [拆成小步驟]</text>

    <text x="18" y="120" fill="#cbd5e1" font-size="12">• 點擊後需通知 Android 原生</text>
    <text x="18" y="142" fill="#cbd5e1" font-size="12">• 若選「拆小步驟」切換為「確認新增子任務」</text>
  </g>

  <!-- ==================== 資料流線條與序號標示 ==================== -->

  <!-- 線條 1: Todoist -> Worker 掃描 (斷點 ①) -->
  <path d="M 215 255 L 215 300" fill="none" stroke="#f97316" stroke-width="3" stroke-dasharray="6 3" marker-end="url(#arrow-orange)"/>
  <rect x="150" y="265" width="130" height="22" rx="4" fill="#0f172a" stroke="#f97316"/>
  <text x="156" y="280" fill="#fed7aa" font-size="11" font-weight="700">① 定時拉取任務 (缺)</text>

  <!-- 線條 2: Worker -> Android 原生 (暢通！綠線) -->
  <path d="M 380 340 L 440 340" fill="none" stroke="#10b981" stroke-width="3" marker-end="url(#arrow-green)"/>
  <rect x="382" y="305" width="100" height="22" rx="4" fill="#064e3b" stroke="#10b981"/>
  <text x="390" y="320" fill="#a7f3d0" font-size="11" font-weight="700">FCM 既有通道 🟢</text>

  <!-- 線條 3: Android 原生 -> 懸浮窗演出 (台詞暢通！但按鈕缺掛載 斷點 ②) -->
  <path d="M 760 340 L 820 340" fill="none" stroke="#f97316" stroke-width="3" stroke-dasharray="6 3" marker-end="url(#arrow-orange)"/>
  <rect x="710" y="305" width="160" height="22" rx="4" fill="#0f172a" stroke="#f97316"/>
  <text x="716" y="320" fill="#fed7aa" font-size="11" font-weight="700">② 台詞演出＋掛按鈕 (缺)</text>

  <!-- 線條 4: 懸浮窗泡泡 -> 使用者點擊 -->
  <path d="M 980 475 L 980 590" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <rect x="915" y="525" width="130" height="22" rx="4" fill="#0f172a" stroke="#38bdf8"/>
  <text x="925" y="540" fill="#bae6fd" font-size="11" font-weight="700">使用者點選動作</text>

  <!-- 線條 5: 使用者點擊 -> Android 原生 (斷點 ③: 缺 JSBridge) -->
  <path d="M 820 670 L 760 670" fill="none" stroke="#f97316" stroke-width="3" stroke-dasharray="6 3" marker-end="url(#arrow-orange)"/>
  <rect x="735" y="635" width="150" height="22" rx="4" fill="#0f172a" stroke="#f97316"/>
  <text x="742" y="650" fill="#fed7aa" font-size="11" font-weight="700">③ JS 橋接回傳 (缺)</text>

  <!-- 線條 6: Android 原生 -> Worker API (暢通！綠線) -->
  <path d="M 440 670 L 380 670" fill="none" stroke="#10b981" stroke-width="3" marker-end="url(#arrow-green)"/>
  <rect x="365" y="635" width="145" height="22" rx="4" fill="#064e3b" stroke="#10b981"/>
  <text x="373" y="650" fill="#a7f3d0" font-size="11" font-weight="700">WorkerApi.post 已通 🟢</text>

  <!-- 線條 7: Worker 動作處理 -> Todoist 實體寫入 (斷點 ④) -->
  <path d="M 55 670 L 25 670 L 25 215 L 55 215" fill="none" stroke="#f97316" stroke-width="3" stroke-dasharray="6 3" marker-end="url(#arrow-orange)"/>
  <rect x="5" y="440" width="145" height="24" rx="4" fill="#0f172a" stroke="#f97316"/>
  <text x="12" y="456" fill="#fed7aa" font-size="11" font-weight="700">④ 真正寫入 Todoist (缺)</text>

</svg>
