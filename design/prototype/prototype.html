<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F3 盤前均線原型 v2</title>
<style>
/* 版面：左欄放控制與核心路徑，右欄是 375px 手機框；窄螢幕改為上下堆疊 */
:root {
  --bg: #eef0f3;
  --fg: #1d2330;
  --muted: #5d6677;
  --card: #ffffff;
  --line: #d3d8e0;
  --accent: #0a6ad8;
  --accent-fg: #ffffff;
  --ok: #1b7f4b;
  --warn-bg: #fff4d6;
  --warn-fg: #6b4a00;
  --font: system-ui, -apple-system, "Segoe UI", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;

  /* 手機螢幕內（App 現況色，來自 colors／drawable／index.html，不隨網頁主題變） */
  --p-wall-1: #1c1c24;
  --p-wall-2: #2b2142;
  --p-glass: rgba(255, 255, 255, 0.10);
  --p-glass-line: rgba(255, 255, 255, 0.20);
  --p-text: #ffffff;
  --p-sub: rgba(235, 235, 245, 0.62);
  --p-blue: #0a84ff;
  --p-bubble: rgba(255, 255, 255, 0.95);
  --p-ink: #222222;
  --pk-mic: #ff8fab;
  --pk-chat: #8fb8ff;
  --pk-resist: #8fd3a8;
  --pk-hist: #ffd166;
  --pk-ma: #c9b0ff;
  --p-up: #ff6b6b;
  --p-down: #4cd08a;
  --p-flat: #c8ccd8;
  --ma5: #ffd166;
  --ma20: #8fb8ff;
  --ma60: #c9b0ff;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14171d; --fg: #e8ebf1; --muted: #9aa3b5; --card: #1e232c; --line: #323945;
    --accent: #6aa8ff; --accent-fg: #0d1522; --ok: #5ccf94; --warn-bg: #3a2f10; --warn-fg: #f2d58a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14171d; --fg: #e8ebf1; --muted: #9aa3b5; --card: #1e232c; --line: #323945;
  --accent: #6aa8ff; --accent-fg: #0d1522; --ok: #5ccf94; --warn-bg: #3a2f10; --warn-fg: #f2d58a;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); line-height: 1.6; padding-inline: 16px; padding-block: 20px 40px; }
h1 { font-size: 1.35rem; margin: 0; text-wrap: balance; }
h2 { font-size: 0.8rem; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 8px; text-transform: uppercase; font-weight: 600; }
p { margin: 0; }
button { font: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.wrap { max-width: 1120px; margin-inline: auto; display: grid; grid-template-columns: minmax(0, 1fr) 375px; gap: 28px; align-items: start; }
.head { grid-column: 1 / -1; display: grid; gap: 4px; }
.head p { color: var(--muted); max-width: 70ch; }
.side { display: grid; gap: 18px; min-width: 0; }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; min-width: 0; }

.seg { display: inline-flex; flex-wrap: wrap; gap: 6px; }
.seg button { border: 1px solid var(--line); background: var(--bg); color: var(--fg); padding: 6px 12px; border-radius: 8px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }
.ctl { display: grid; gap: 12px; }
.ctl-row { display: grid; gap: 6px; }
.ctl-row > span { font-size: 0.85rem; color: var(--muted); }
.replay { border: 1px solid var(--line); background: var(--card); color: var(--fg); padding: 6px 12px; border-radius: 8px; justify-self: start; }

.ver-note { font-size: 0.92rem; }
.ver-note b { color: var(--accent); }

ol.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
ol.steps li { display: grid; grid-template-columns: 22px 1fr; gap: 8px; align-items: start; font-size: 0.92rem; color: var(--muted); }
ol.steps li .dot { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-size: 12px; margin-top: 2px; }
ol.steps li.done { color: var(--fg); }
ol.steps li.done .dot { background: var(--ok); border-color: var(--ok); color: #fff; }
ol.steps li.now { color: var(--fg); font-weight: 600; }
ol.steps li.now .dot { border-color: var(--accent); }

.tbl { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 0.85rem; min-width: 460px; }
th, td { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
th { color: var(--muted); font-weight: 600; }
tr.cur td, tr.cur th { }
td.cur, th.cur { background: color-mix(in srgb, var(--accent) 12%, transparent); }
.flag { background: var(--warn-bg); color: var(--warn-fg); border-radius: 10px; padding: 10px 12px; font-size: 0.88rem; }
.flag b { display: block; margin-bottom: 2px; }

/* ===== 手機框 ===== */
.phone-col { position: sticky; top: 16px; }
.phone { width: 375px; max-width: 100%; height: 760px; border-radius: 34px; border: 8px solid #0b0c10; background: #000; position: relative; overflow: hidden; margin-inline: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.25); }
.screen { position: absolute; inset: 0; overflow: hidden; background: linear-gradient(160deg, var(--p-wall-1), var(--p-wall-2)); color: var(--p-text); font-family: var(--font); }
.sbar { position: absolute; top: 0; left: 0; right: 0; height: 28px; display: flex; justify-content: space-between; align-items: center; padding-inline: 20px; font-size: 12px; z-index: 40; pointer-events: none; }
.launcher { position: absolute; inset: 56px 18px auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px 10px; opacity: 0.55; }
.launcher i { display: block; aspect-ratio: 1; border-radius: 16px; background: rgba(255,255,255,0.22); }
.launcher span { display: block; text-align: center; font-size: 10px; margin-top: 4px; font-style: normal; }
.launcher div { display: block; }

/* 通知欄卡片（角色模式關） */
.shade { position: absolute; top: 34px; left: 10px; right: 10px; z-index: 30; background: rgba(250,250,252,0.96); color: #1d2330; border-radius: 16px; padding: 10px 12px; display: grid; grid-template-columns: 36px 1fr; gap: 10px; text-align: left; border: 0; width: calc(100% - 20px); }
.shade .ic { width: 36px; height: 36px; border-radius: 50%; background: var(--pk-mic); display: grid; place-items: center; font-size: 18px; }
.shade small { color: #667; font-size: 11px; }
.shade b { display: block; font-size: 13px; }
.shade span.t { display: block; font-size: 12.5px; color: #333; }

/* 懸浮角色（照 pet/index.html：角色 96×108、泡泡寬 156） */
.overlay { position: absolute; right: 6px; bottom: 110px; z-index: 20; display: flex; flex-direction: row; align-items: flex-end; justify-content: flex-end; font-family: sans-serif; }
.bubble { box-sizing: border-box; width: 156px; max-height: 240px; margin: 0 4px; padding: 6px 8px; background: var(--p-bubble); border-radius: 12px; color: var(--p-ink); font-size: 13px; line-height: 1.35; display: flex; flex-direction: column; gap: 6px; overflow: hidden; }
.bubble .txt { white-space: pre-wrap; word-break: break-all; min-height: 1em; flex: 1 1 auto; overflow-y: auto; }
.bubble .sum { display: flex; flex-wrap: wrap; gap: 4px; flex: 0 0 auto; }
.bubble .sum span { font-size: 11px; padding: 1px 6px; border-radius: 8px; background: #eef0f4; }
.bubble .sum .u { background: #ffe0e0; } .bubble .sum .d { background: #d6f3e4; }
.bubble .row { display: flex; flex-wrap: wrap; gap: 4px; flex: 0 0 auto; }
.bubble .row.f3 button { border: 1px solid #8fb8ff; border-radius: 12px; padding: 3px 8px; background: #fff; color: #222; font-size: 12px; }
.bubble .row.act { gap: 6px; }
.bubble .row.act button { border: none; border-radius: 16px; padding: 4px 10px; color: #fff; font-size: 13px; }
.bubble .b-mic { background: var(--pk-mic); } .bubble .b-chat { background: var(--pk-chat); }
.bubble .b-resist { background: var(--pk-resist); } .bubble .b-hist { background: var(--pk-hist) !important; color: #222 !important; }
.bubble .b-ma { background: var(--pk-ma) !important; color: #222 !important; outline: 2px dashed #7b5cd6; outline-offset: 1px; }
.pet { width: 96px; height: 108px; border: 0; background: transparent; padding: 0; flex: 0 0 auto; }
.pet svg { width: 100%; height: 100%; display: block; }
.newtag { position: absolute; right: 8px; bottom: 50px; font-size: 10px; color: #c9b0ff; z-index: 19; }

/* 全螢幕頁（明細／管理） */
.sheet { position: absolute; inset: 0; z-index: 35; background: linear-gradient(160deg, var(--p-wall-1), var(--p-wall-2)); display: flex; flex-direction: column; transform: translateY(0); transition: transform 0.22s ease; padding-top: 28px; }
.sheet[hidden] { display: none !important; }
.bar { display: flex; align-items: center; gap: 8px; padding: 6px 12px; min-height: 48px; }
.bar h3 { font-size: 16px; margin: 0; flex: 1; text-wrap: balance; }
.ibtn { border: 1px solid var(--p-glass-line); background: var(--p-glass); color: var(--p-text); border-radius: 12px; min-height: 36px; padding: 0 12px; font-size: 13px; }
.ibtn.sq { width: 36px; padding: 0; }
.body { flex: 1; overflow-y: auto; padding: 4px 14px 16px; display: grid; gap: 10px; align-content: start; }
.sub { font-size: 12px; color: var(--p-sub); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12px; padding: 2px 10px; border-radius: 10px; background: var(--p-glass); border: 1px solid var(--p-glass-line); }
.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: var(--p-glass); border-radius: 12px; padding: 3px; }
.tabs button { border: 0; background: transparent; color: var(--p-sub); border-radius: 10px; min-height: 34px; font-size: 13px; }
.tabs button[aria-selected="true"] { background: var(--p-blue); color: #fff; font-weight: 600; }
.card { background: var(--p-glass); border: 1px solid var(--p-glass-line); border-radius: 18px; padding: 12px 14px; display: grid; gap: 8px; }
.card.pend { opacity: 0.7; }
.ctop { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.ctop .nm { font-weight: 600; font-size: 15px; }
.ctop .cd { font-family: var(--mono); font-size: 12px; color: var(--p-sub); margin-right: 6px; }
.tag { font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: 10px; white-space: nowrap; color: #14161c; }
.tag.u { background: var(--p-up); } .tag.d { background: var(--p-down); } .tag.m { background: var(--p-flat); }
.desc { font-size: 13px; color: var(--p-text); }
.ma { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; font-size: 12px; }
.ma .pill { padding: 1px 8px; border-radius: 8px; color: #14161c; font-variant-numeric: tabular-nums; }
.ma .gt { color: var(--p-sub); }
.disc { font-size: 12px; color: var(--p-sub); text-align: center; padding: 6px 0 2px; }
.note { border: 1px dashed var(--p-glass-line); border-radius: 14px; padding: 14px; font-size: 13px; display: grid; gap: 10px; justify-items: start; }
.btn { border: 0; background: var(--p-blue); color: #fff; border-radius: 12px; min-height: 38px; padding: 0 16px; font-size: 14px; }
.btn.ghost { background: var(--p-glass); border: 1px solid var(--p-glass-line); }
.skel { height: 92px; border-radius: 18px; background: linear-gradient(90deg, rgba(255,255,255,0.06), rgba(255,255,255,0.16), rgba(255,255,255,0.06)); background-size: 200% 100%; animation: sh 1.2s linear infinite; }
@keyframes sh { to { background-position: -200% 0; } }

.mx { width: 100%; border-collapse: separate; border-spacing: 3px; min-width: 0; font-size: 12px; }
.mx th { border: 0; color: var(--p-sub); font-weight: 400; padding: 0; text-align: center; font-size: 11px; }
.mx th.l, .mx td.l { text-align: left; white-space: nowrap; width: 76px; }
.mx td { border: 0; padding: 0; }
.cell { width: 100%; height: 32px; border: 2px solid transparent; border-radius: 8px; font-size: 12px; font-weight: 600; color: #14161c; }
.cell.u { background: var(--p-up); } .cell.d { background: var(--p-down); } .cell.m { background: var(--p-flat); }
.cell.chg { border-color: #fff; }
.cell.sel { box-shadow: 0 0 0 2px var(--p-blue); }
.cell:disabled { background: transparent; color: var(--p-sub); border: 1px dashed var(--p-glass-line); }
.readout { min-height: 44px; font-size: 13px; }
.legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; color: var(--p-sub); align-items: center; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 4px; vertical-align: -2px; margin-right: 4px; }
.legend i.ring { background: transparent; border: 2px solid #fff; }

.mrow { background: var(--p-glass); border: 1px solid var(--p-glass-line); border-radius: 14px; padding: 8px 8px 8px 14px; display: flex; align-items: center; gap: 8px; }
.mrow .mi { flex: 1; min-width: 0; }
.mrow .mi small { display: block; color: var(--p-sub); font-size: 11px; }
.addf { display: flex; gap: 8px; }
.addf input { flex: 1; min-width: 0; min-height: 40px; border-radius: 12px; border: 1px solid var(--p-glass-line); background: rgba(0,0,0,0.25); color: #fff; padding: 0 12px; font: inherit; font-size: 14px; }
.err { color: #ffb4b4; font-size: 12.5px; min-height: 18px; }
.snack { position: absolute; left: 12px; right: 12px; bottom: 16px; z-index: 50; background: #f1f2f6; color: #1d2330; border-radius: 12px; padding: 8px 12px; font-size: 13px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.snack button { border: 0; background: transparent; color: #0a5fc4; font-weight: 700; font-size: 13px; min-height: 32px; }

@media (max-width: 860px) {
  .wrap { grid-template-columns: minmax(0, 1fr); }
  .phone-col { position: static; order: -1; }
  .phone { height: 720px; }
}
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
@media (prefers-reduced-motion: reduce) { .skel { animation: none; } .sheet { transition: none; } }

.linkbtn { border: 0; background: transparent; color: #8fc2ff; font-size: 13px; text-align: left; padding: 4px 0; min-height: 32px; text-decoration: underline; text-underline-offset: 3px; justify-self: start; }
.whybtn { border: 1px solid var(--p-glass-line); background: transparent; color: var(--p-text); border-radius: 10px; min-height: 32px; padding: 0 10px; font-size: 12px; justify-self: start; }
.whybtn[aria-expanded="true"] { background: var(--p-glass); }
.why { border-top: 1px dashed var(--p-glass-line); padding-top: 8px; display: grid; gap: 8px; }
.why .key { font-size: 12px; color: var(--p-sub); }
.why .def { font-size: 13px; }
.why .meta { font-size: 13px; background: rgba(255,255,255,0.08); border-radius: 12px; padding: 8px 10px; }
.why .fine { font-size: 11.5px; color: var(--p-sub); }
.why svg, .kcard svg { width: 100%; height: auto; display: block; }
.keyrow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; }
.keyrow .pill { padding: 1px 8px; border-radius: 8px; color: #14161c; }
.kcard { background: var(--p-glass); border: 1px solid var(--p-glass-line); border-radius: 18px; padding: 12px 14px; display: grid; gap: 8px; }
.kcard h4 { margin: 0; font-size: 14px; }
.kcard .meta { font-size: 13px; background: rgba(255,255,255,0.08); border-radius: 12px; padding: 8px 10px; }
.sec { font-size: 12px; color: var(--p-sub); letter-spacing: 0.06em; margin-top: 4px; }
.ar { margin-right: 2px; }
@media (max-width: 860px) {
  .wrap { grid-template-columns: minmax(0, 1fr); }
  .phone-col { position: static; order: -1; }
  .phone { height: 720px; }
}
@media (prefers-reduced-motion: reduce) { .skel { animation: none; } .sheet { transition: none; } }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>

<main class="wrap">
  <header class="head">
    <h1>F3 盤前均線（含轉弱、轉強說明）</h1>
    <p>這一版新增兩處說明：每檔卡片的「什麼意思？」，以及明細頁上方的「看懂排列」。比喻統一用天氣：5 日線是今天的氣溫、20 日線是這個月的平均、60 日線是這一季的平均。資料全是範例，不是真實行情。</p>
  </header>

  <section class="side" aria-label="控制與說明">
    <div class="panel ctl">
      <div class="ctl-row"><span>角色模式（快速設定磚）</span>
        <div class="seg" id="roleSeg" role="group" aria-label="角色模式">
          <button type="button" data-r="on" aria-pressed="true">開：角色出現說話</button>
          <button type="button" data-r="off" aria-pressed="false">關：一般通知</button>
        </div>
      </div>
      <div class="ctl-row"><span>範例清單</span>
        <div class="seg" id="listSeg" role="group" aria-label="範例清單">
          <button type="button" data-l="5" aria-pressed="true">5 檔</button>
          <button type="button" data-l="8" aria-pressed="false">8 檔（8 種排列都有）</button>
        </div>
      </div>
      <div class="ctl-row"><span>資料狀態</span>
        <div class="seg" id="dataSeg" role="group" aria-label="資料狀態">
          <button type="button" data-d="ok" aria-pressed="true">正常</button>
          <button type="button" data-d="loading" aria-pressed="false">載入中</button>
          <button type="button" data-d="error" aria-pressed="false">取得失敗</button>
          <button type="button" data-d="empty" aria-pressed="false">清單是空的</button>
        </div>
      </div>
      <button type="button" class="replay" id="replay">▶ 重播 08:30 推播</button>
    </div>

    <div class="panel">
      <h2>這次要體驗的路徑（點過會打勾）</h2>
      <ol class="steps" id="steps"></ol>
    </div>
  </section>

  <section class="phone-col" aria-label="手機預覽">
    <div class="phone" id="phone"></div>
  </section>
</main>

    var key = S.screen + '|' + S.tab;
    var html = '<div class="screen"><div class="sbar"><span>' + (S.screen === 'home' && S.bubble === 'report' ? '08:30' : '08:31') + '</span><span>5G ▮▮▮</span></div>' +
      '<div class="launcher">' + ['訊息', '相機', '地圖', '音樂', '相簿', '時鐘', '設定', '瀏覽器'].map(function (n) { return '<div><i></i><span>' + n + '</span></div>'; }).join('') + '</div>';
    var inHome = S.screen === 'home';
    if (S.role === 'off' && inHome && S.bubble === 'report') html += shadeHtml();
    if (inHome && (S.role === 'on' || S.bubble === 'menu')) {
      html += '<div class="overlay">' + (S.bubble === 'none' ? '' : bubbleHtml()) + '<button type="button" class="pet" data-a="pet" aria-label="角色，點一下開關泡泡">' + petSvg() + '</button></div>';
    }
    var inner = S.screen === 'detail' ? detailHtml() : (S.screen === 'manage' ? manageHtml() : (S.screen === 'glossary' ? glossaryHtml() : ''));
    html += '<div class="sheet" id="sheet"' + (inHome ? ' hidden' : '') + '>' + inner + '</div>';
    if (S.undo) html += '<div class="snack" role="status"><span>已停止追蹤 ' + esc(S.undo.code + ' ' + nameOf(S.undo.code)) + '</span><button type="button" data-a="undo">復原</button></div>';
    html += '</div>';
    phone.innerHTML = html;
    var nb = phone.querySelector('.sheet .body');
    if (nb && key === lastKey) nb.scrollTop = prevTop;
    lastKey = key;
    if (S.focus) { var f = phone.querySelector(S.focus); if (f) f.focus(); S.focus = null; }
    var bt = document.getElementById('btxt');
    if (bt) { var tx = bubbleText(); if (S.bubble === 'report' && S.fresh) typeInto(bt, tx); else bt.textContent = tx; }
    S.fresh = false;
  }

  // ===== 事件 =====
  function go(screen) { S.screen = screen; S.addErr = ''; render(); }
  function findStock(c) { return S.stocks.filter(function (s) { return s.code === c; })[0]; }

  function addStock(raw) {
    var q = raw.trim();
    if (!q) { S.addErr = '請輸入股票代號或名稱。'; return; }
    var code = null;
    Object.keys(UNIVERSE).forEach(function (k) { if (k === q || UNIVERSE[k] === q) code = k; });
    if (!code) { S.addErr = '查不到「' + q + '」，請輸入證交所的股票代號或完整名稱。'; return; }
    if (findStock(code)) { S.addErr = code + ' ' + UNIVERSE[code] + ' 已經在追蹤清單裡了。'; return; }
    if (S.stocks.length >= LIMIT) { S.addErr = '最多追蹤 ' + LIMIT + ' 檔，請先停止追蹤一檔。'; return; }
    S.stocks.push({ code: code, ma: [0, 0, 0], kind: 'T', desc: '', hist: 'TTTTTTT', pending: true });
    S.addErr = '';
    if (S.data === 'empty') { S.data = 'ok'; syncSegs(); }
    mark('add');
  }

  phone.addEventListener('click', function (e) {
    var t = e.target.closest('[data-a]');
    if (!t) return;
    var a = t.getAttribute('data-a');
    if (a === 'pet') { S.bubble = S.bubble === 'none' ? 'menu' : 'none'; render(); return; }
    if (a === 'dismiss') { S.bubble = 'none'; render(); return; }
    if (a === 'open' || a === 'shade') { S.tab = 'today'; S.sel = null; S.bubble = 'none'; mark('open'); go('detail'); return; }
    if (a === 'reopen') { S.tab = 'today'; S.sel = null; S.bubble = 'none'; mark('reopen'); go('detail'); return; }
    if (a === 'back') {
      if (S.screen === 'manage' || S.screen === 'glossary') { go('detail'); return; }
      S.bubble = 'none'; go('home'); return;
    }
    if (a === 'gomanage') { S.bubble = 'none'; mark('manage'); go('manage'); return; }
    if (a === 'gloss') { mark('glossary'); go('glossary'); return; }
    if (a === 'why') {
      var wc = t.getAttribute('data-c');
      S.open[wc] = !S.open[wc]; if (S.open[wc]) mark('explain');
      S.focus = '.whybtn[data-c="' + wc + '"]'; render(); return;
    }
    if (a === 'tab') { S.tab = t.getAttribute('data-t'); S.sel = null; if (S.tab === 'history') mark('history'); render(); return; }
    if (a === 'cell') {
      var i = parseInt(t.getAttribute('data-i'), 10), cc = t.getAttribute('data-c');
      S.sel = { c: cc, i: i, d: DAYS[i] }; mark('cell'); S.focus = '.cell[data-c="' + cc + '"][data-i="' + i + '"]'; render(); return;
    }
    if (a === 'retry') { S.data = 'loading'; syncSegs(); render(); clearTimeout(loadTimer); loadTimer = setTimeout(function () { S.data = 'ok'; syncSegs(); render(); }, 900); return; }
    if (a === 'untrack') {
      var c = t.getAttribute('data-c'), idx = -1;
      S.stocks.forEach(function (s, k) { if (s.code === c) idx = k; });
      if (idx < 0) return;
      S.undo = { code: c, idx: idx, item: S.stocks.splice(idx, 1)[0] };
      clearTimeout(snackTimer);
      snackTimer = setTimeout(function () { S.undo = null; render(); }, 6000);
      render(); return;
    }
    if (a === 'undo' && S.undo) { S.stocks.splice(S.undo.idx, 0, S.undo.item); S.undo = null; clearTimeout(snackTimer); render(); return; }
  });
  phone.addEventListener('submit', function (e) {
    e.preventDefault();
    var inp = document.getElementById('addInput');
    addStock(inp ? inp.value : '');
    render();
    var again = document.getElementById('addInput'); if (again && S.addErr) again.focus();
  });

  // ===== 控制列 =====
  function pressed(id, attr, val) {
    Array.prototype.forEach.call(document.getElementById(id).querySelectorAll('button'), function (b) { b.setAttribute('aria-pressed', String(b.getAttribute(attr) === val)); });
  }
  function syncSegs() { pressed('roleSeg', 'data-r', S.role); pressed('dataSeg', 'data-d', S.data); pressed('listSeg', 'data-l', S.extra ? '8' : '5'); }
  function renderSteps() {
    var nowSet = false;
    document.getElementById('steps').innerHTML = STEPS.map(function (st) {
      var done = !!S.done[st[0]];
      var cls = done ? 'done' : (!nowSet ? 'now' : ''); if (!done && !nowSet) nowSet = true;
      return '<li class="' + cls + '"><span class="dot" aria-hidden="true">' + (done ? '✓' : '') + '</span><span>' + esc(st[1]) + (done ? '<span class="sr"> （已完成）</span>' : '') + '</span></li>';
    }).join('');
  }
  function replay() {
    clearTimeout(snackTimer); S.undo = null; S.done = {}; S.screen = 'home'; S.tab = 'today'; S.sel = null; S.addErr = ''; S.bubble = 'report'; S.fresh = true; S.open = {};
    resetStocks();
    if (S.data === 'loading') S.data = 'ok';
    syncSegs(); renderSteps(); render(); mark('push');
  }
  document.getElementById('roleSeg').addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; S.role = b.getAttribute('data-r'); replay(); });
  document.getElementById('listSeg').addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; S.extra = b.getAttribute('data-l') === '8'; replay(); });
  document.getElementById('dataSeg').addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; S.data = b.getAttribute('data-d'); syncSegs(); if (S.screen === 'home') { S.fresh = S.bubble !== 'none'; if (S.bubble !== 'none') S.bubble = 'report'; } render(); });
  document.getElementById('replay').addEventListener('click', replay);
  replay();
})();
</script>
